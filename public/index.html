<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain-Manage — 产品 & 域名指挥中心</title>
  <meta name="description" content="个人产品与域名管理系统：统一管理服务状态、域名到期与 Cloudflare DNS。">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><rect x='6' y='6' width='13' height='13' fill='%2376b900'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/public/style.css?v=4">
</head>
<body>

<a href="#main" class="skip-link">跳到主内容</a>

<!-- ============================================================
     SURFACE: Utility Bar
     ============================================================ -->
<header class="utility-bar">
  <div class="status-dot">
    <span id="cf-status-dot" class="dot red" aria-hidden="true"></span>
    <span id="cf-status-text">CF 未连接</span>
  </div>
  <span id="sync-time" class="text-mute"></span>
  <button type="button" onclick="openSettings()" aria-label="打开设置">设置</button>
</header>

<!-- ============================================================
     SURFACE: Primary Navigation
     ============================================================ -->
<nav class="primary-nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="#" class="nav-brand" onclick="navigate('dashboard'); return false;">
      <span class="corner-square" aria-hidden="true"></span>
      <span>Domain-Manage</span>
    </a>
    <div class="nav-links">
      <button type="button" class="nav-link active" data-view="dashboard" onclick="navigate('dashboard')">总览</button>
      <button type="button" class="nav-link" data-view="services" onclick="navigate('services')">服务</button>
      <button type="button" class="nav-link" data-view="domains" onclick="navigate('domains')">域名</button>
    </div>
    <div class="nav-actions">
      <button type="button" class="btn btn-outline-on-dark" onclick="syncFromCloudflare()">同步 CF</button>
    </div>
  </div>
</nav>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<main id="main">

  <!-- VIEW: Dashboard -->
  <section id="view-dashboard" class="view active">
    <div class="container">

      <header class="view-header">
        <h1 class="display-lg">总览</h1>
        <p class="body-sm text-mute">基础设施状态一览</p>
      </header>

      <!-- Metric Cards -->
      <div class="metric-grid">
        <a href="#" class="metric-card" onclick="navigate('services'); return false;">
          <div class="metric-value" id="metric-services-running">0</div>
          <div class="metric-label">服务运行中</div>
          <div class="metric-sub" id="metric-services-total">共 0 个服务</div>
        </a>

        <a href="#" class="metric-card" onclick="navigate('domains'); return false;">
          <div class="metric-value" id="metric-domains-active">0</div>
          <div class="metric-label">活跃域名</div>
          <div class="metric-sub" id="metric-domains-total">共 0 个域名</div>
        </a>

        <a href="#" class="metric-card" onclick="navigate('domains'); return false;">
          <div class="metric-value" id="metric-expiring">0</div>
          <div class="metric-label">即将到期</div>
          <div class="metric-sub">30天内</div>
        </a>

        <a href="#" class="metric-card" onclick="showAlerts(); return false;">
          <div class="metric-value" id="metric-alerts">0</div>
          <div class="metric-label">异常状态</div>
          <div class="metric-sub">需要关注</div>
        </a>
      </div>

      <!-- Alerts Panel -->
      <div id="alerts-panel" class="alerts-panel hidden">
        <h2 class="heading-md">告警信息</h2>
        <div id="alerts-list" class="alerts-list"></div>
      </div>

    </div>
  </section>

  <!-- VIEW: Services -->
  <section id="view-services" class="view">
    <div class="container">

      <header class="view-header">
        <div>
          <h1 class="display-lg">服务</h1>
          <p class="body-sm text-mute">管理你的所有服务和应用</p>
        </div>
        <div class="view-actions">
          <button type="button" class="btn btn-outline" id="btn-toggle-services-view" onclick="toggleServicesView()">
            <span>列表</span>
          </button>
          <button type="button" class="btn btn-primary" onclick="openServiceModal()">+ 添加服务</button>
        </div>
      </header>

      <div class="filter-bar">
        <input type="search" class="text-input search-input" id="services-search" placeholder="搜索服务..." oninput="renderServices()">
        <select class="text-input" id="services-filter-status" onchange="renderServices()">
          <option value="">全部状态</option>
          <option value="running">运行中</option>
          <option value="stopped">已停止</option>
          <option value="maintenance">维护中</option>
        </select>
      </div>

      <div id="services-grid" class="services-grid"></div>
      <div id="services-list" class="services-list hidden"></div>

    </div>
  </section>

  <!-- VIEW: Domains -->
  <section id="view-domains" class="view">
    <div class="container">

      <header class="view-header">
        <div>
          <h1 class="display-lg">域名</h1>
          <p class="body-sm text-mute">管理域名、DNS 解析和到期时间</p>
        </div>
        <div class="view-actions">
          <button type="button" class="btn btn-outline" id="btn-toggle-domains-view" onclick="toggleDomainsView()">
            <span>列表</span>
          </button>
          <button type="button" class="btn btn-primary" onclick="openDomainModal()">+ 添加域名</button>
        </div>
      </header>

      <div class="filter-bar">
        <input type="search" class="text-input search-input" id="domains-search" placeholder="搜索域名..." oninput="renderDomains()">
        <select class="text-input" id="domains-filter-status" onchange="renderDomains()">
          <option value="">全部状态</option>
          <option value="active">活跃</option>
          <option value="inactive">未解析</option>
        </select>
      </div>

      <div id="domains-grid" class="domains-grid"></div>
      <div id="domains-list" class="domains-list hidden"></div>

    </div>
  </section>

</main>

<!-- ============================================================
     MODALS
     ============================================================ -->

<!-- Modal: Service -->
<div id="modal-service" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="service-modal-title">
  <div class="modal">
    <button class="modal-close" type="button" aria-label="关闭" onclick="closeModal('modal-service')">✕</button>
    <h3 class="modal-title" id="service-modal-title">添加服务</h3>
    <form id="form-service" onsubmit="saveService(event)">
      <input type="hidden" id="service-id">

      <div class="form-group">
        <label for="service-name">服务名称 *</label>
        <input type="text" class="text-input" id="service-name" required>
      </div>

      <div class="form-group">
        <label for="service-cover">封面图片</label>
        <div class="cover-upload">
          <img id="service-cover-preview" class="cover-preview" src="" alt="">
          <input type="file" id="service-cover-file" accept="image/*" onchange="uploadCover(event)">
          <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('service-cover-file').click()">上传图片</button>
        </div>
      </div>

      <div class="form-group">
        <label for="service-domain">关联域名</label>
        <input type="text" class="text-input" id="service-domain" placeholder="example.com, api.example.com">
        <p class="hint">多个域名用逗号分隔</p>
      </div>

      <div class="form-group">
        <label for="service-status">状态</label>
        <select class="text-input" id="service-status">
          <option value="running">运行中</option>
          <option value="stopped">已停止</option>
          <option value="maintenance">维护中</option>
        </select>
      </div>

      <div class="form-group">
        <label for="service-notes">备注</label>
        <textarea class="text-input" id="service-notes" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">保存</button>
    </form>
  </div>
</div>

<!-- Modal: Domain -->
<div id="modal-domain" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="domain-modal-title">
  <div class="modal">
    <button class="modal-close" type="button" aria-label="关闭" onclick="closeModal('modal-domain')">✕</button>
    <h3 class="modal-title" id="domain-modal-title">添加域名</h3>
    <form id="form-domain" onsubmit="saveDomain(event)">
      <input type="hidden" id="domain-id">

      <div class="form-group">
        <label for="domain-name">域名 *</label>
        <input type="text" class="text-input" id="domain-name" required placeholder="example.com">
      </div>

      <div class="form-group">
        <label for="domain-ip">解析 IP</label>
        <input type="text" class="text-input" id="domain-ip" placeholder="38.76.219.132">
      </div>

      <div class="form-group">
        <label for="domain-service">关联服务</label>
        <select class="text-input" id="domain-service" multiple>
          <option value="">无</option>
        </select>
        <p class="hint">按住 Ctrl/Cmd 可选择多个服务</p>
      </div>

      <div class="form-group">
        <label for="domain-dns-status">DNS 状态</label>
        <select class="text-input" id="domain-dns-status">
          <option value="active">已解析</option>
          <option value="inactive">未解析</option>
        </select>
      </div>

      <div class="form-group">
        <label for="domain-expiry">到期时间</label>
        <input type="date" class="text-input" id="domain-expiry">
      </div>

      <div class="form-group">
        <label for="domain-ssl-status">SSL 状态</label>
        <select class="text-input" id="domain-ssl-status">
          <option value="active">正常</option>
          <option value="expiring">即将到期</option>
          <option value="expired">已过期</option>
          <option value="unknown">未知</option>
        </select>
      </div>

      <div class="form-group">
        <label for="domain-notes">备注</label>
        <textarea class="text-input" id="domain-notes" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">保存</button>
    </form>
  </div>
</div>

<!-- Modal: Settings -->
<div id="modal-settings" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal">
    <button class="modal-close" type="button" aria-label="关闭" onclick="closeModal('modal-settings')">✕</button>
    <h3 class="modal-title" id="settings-title">设置</h3>
    <div class="form-group" style="margin-bottom:var(--sp-xl)">
      <label for="settings-cf-token">Cloudflare API Token</label>
      <input type="password" class="text-input" id="settings-cf-token" placeholder="输入 CF API Token…" autocomplete="off">
      <p class="hint">需要 Zone:Read + DNS:Read 权限。Token 安全存储于服务器，不会暴露到前端。</p>
    </div>
    <p id="settings-cf-note" class="body-sm text-mute" style="margin-bottom:var(--sp-xl)">输入 Token 后点击"保存"，然后点击"验证"测试连接。</p>
    <div class="modal-actions">
      <button class="btn btn-primary" type="button" onclick="saveCFToken()">保存</button>
      <button class="btn btn-outline" type="button" onclick="testCFConnection()">验证连接</button>
      <button class="btn btn-outline" type="button" onclick="closeModal('modal-settings')">关闭</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-container" id="toast-container" aria-live="polite" aria-label="通知"></div>

<script src="/public/app.js?v=4"></script>
</body>
</html>
