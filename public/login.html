<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · domain-manage</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A0A0B'/><rect x='7' y='7' width='18' height='18' rx='4' fill='%236C5CE7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-hover: #5A4BD4;
      --primary-soft: rgba(108, 92, 231, 0.16);
      --on-primary: #FFFFFF;
      --ink: #F5F6F7;
      --ink-muted: #C6C9D0;
      --ink-subtle: #8B8F99;
      --ink-faint: #5C6069;
      --canvas: #0A0A0B;
      --surface-1: #101013;
      --surface-2: #16161A;
      --hairline: rgba(255, 255, 255, 0.08);
      --hairline-strong: rgba(255, 255, 255, 0.16);
      --danger: #FF8A80;
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 28px;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      background: var(--primary);
    }

    .brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
    .brand-accent { color: #9B8DFF; font-weight: 500; }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.2px;
    }

    .sub {
      margin: 6px 0 20px;
      font-size: 12px;
      color: var(--ink-subtle);
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

    .field-label { font-size: 12px; font-weight: 500; color: var(--ink-muted); }

    .input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 14px;
      transition: border-color 120ms ease-out, box-shadow 120ms ease-out;
    }

    .input::placeholder { color: var(--ink-faint); }
    .input:hover { border-color: var(--hairline-strong); }
    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    .btn {
      width: 100%;
      height: 36px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--on-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease-out;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      min-height: 18px;
      margin: 0 0 4px;
      font-size: 12px;
      color: var(--ink-subtle);
    }

    .msg.error { color: var(--danger); }

    .foot {
      font-size: 12px;
      color: var(--ink-faint);
      font-family: var(--font-mono);
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">domain<span class="brand-accent">-manage</span></span>
    </div>

    <h1 id="title">登录</h1>
    <p class="sub" id="sub">请输入访问口令</p>

    <form id="auth-form" novalidate>
      <label class="field">
        <span class="field-label" id="password-label">口令</span>
        <input id="password" class="input" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label class="field hidden" id="confirm-field">
        <span class="field-label">确认口令</span>
        <input id="confirm" class="input" type="password" autocomplete="new-password">
      </label>
      <p class="msg" id="message"></p>
      <button class="btn" id="submit" type="submit">登录</button>
    </form>
  </main>
  <div class="foot">仅限本人使用</div>

  <script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('title');
    const sub = document.getElementById('sub');
    const password = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const confirmField = document.getElementById('confirm-field');
    const message = document.getElementById('message');
    const submit = document.getElementById('submit');
    let mode = 'login';

    function setMessage(text, isError = false) {
      message.textContent = text || '';
      message.classList.toggle('error', isError);
    }

    function applyMode(data) {
      if (data.authenticated) {
        window.location.href = '/';
        return;
      }
      if (!data.has_password) {
        mode = 'setup';
        title.textContent = '设置访问口令';
        sub.textContent = '首次使用，请设置一个访问口令（至少 6 位）';
        confirmField.classList.remove('hidden');
        confirmInput.required = true;
        password.autocomplete = 'new-password';
        submit.textContent = '保存并进入';
      } else {
        mode = 'login';
        if (data.env_override) {
          sub.textContent = '口令由 AUTH_PASSWORD 环境变量管理';
        }
      }
      password.focus();
    }

    async function loadStatus() {
      try {
        const resp = await fetch('/api/auth/status');
        applyMode(await resp.json());
      } catch {
        setMessage('无法连接服务，请刷新重试', true);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      setMessage('');
      const value = password.value;
      if (!value) {
        setMessage('请输入口令', true);
        return;
      }
      if (mode === 'setup') {
        if (value.length < 6) {
          setMessage('口令至少 6 位', true);
          return;
        }
        if (value !== confirmInput.value) {
          setMessage('两次输入的口令不一致', true);
          return;
        }
      }

      submit.disabled = true;
      submit.textContent = mode === 'setup' ? '保存中…' : '登录中…';
      try {
        const resp = await fetch(`/api/auth/${mode === 'setup' ? 'setup' : 'login'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: value }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          setMessage(data.error || '操作失败', true);
          submit.disabled = false;
          submit.textContent = mode === 'setup' ? '保存并进入' : '登录';
          return;
        }
        window.location.href = '/';
      } catch {
        setMessage('网络错误，请重试', true);
        submit.disabled = false;
        submit.textContent = mode === 'setup' ? '保存并进入' : '登录';
      }
    });

    loadStatus();
  </script>
</body>
</html>
