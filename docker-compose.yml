services:
  domain-manage:
    build: .
    container_name: domain-manage
    ports:
      - "3080:3000"
    environment:
      - PORT=3000
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    volumes:
      - domain-data:/app/data  # Persist data + screenshots
    restart: unless-stopped

volumes:
  domain-data:
