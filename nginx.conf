# domain-manage — 宿主机 nginx 参考配置（external reverse proxy）
#
# 架构：Internet → Cloudflare → nginx(:80/:443) → 127.0.0.1:3080（Docker）
# Docker 镜像内不含 nginx；容器端口只绑定本机，见 docker-compose.yml。
#
# 部署方式（Debian/Ubuntu）：
#   cp nginx.conf /etc/nginx/sites-available/domain-manage
#   ln -s /etc/nginx/sites-available/domain-manage /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 自签证书（Cloudflare Full 非严格回源可用；Full (strict) 请改用
# Cloudflare Origin Certificate）：
#   mkdir -p /etc/nginx/ssl
#   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/ssl/waitwinter.key \
#     -out /etc/nginx/ssl/waitwinter.crt \
#     -subj "/CN=waitwinter.eu.cc"

# ---------------------------------------------------------------------------
# 默认 443 站点：未匹配任何 server_name 的 SNI 直接拒绝 TLS 握手。
# 避免其它已解析到本机的占位域名被误反代到面板（也避免泄露面板证书）。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------------------
# 面板站点（把 waitwinter.eu.cc 换成你的域名，证书路径同步修改）
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name waitwinter.eu.cc;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name waitwinter.eu.cc;

    ssl_certificate /etc/nginx/ssl/waitwinter.crt;
    ssl_certificate_key /etc/nginx/ssl/waitwinter.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

